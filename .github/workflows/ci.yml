name: CI

on:
  push:
  pull_request:

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: bahmutov/npm-install@v1
    - run: yarn lint
    - run: yarn test

  release:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: bahmutov/npm-install@v1
    - run: yarn build
    - uses: ph-fritsche/action-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NPM_TOKEN: OIDC
